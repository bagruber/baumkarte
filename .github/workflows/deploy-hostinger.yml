name: Deploy zu moosburg.eu (Hostinger)

# Zweites Ziel neben GitHub Pages. Laeuft nur, wenn die Zugangsdaten als
# Repository Secrets hinterlegt sind — ohne sie beendet sich der Lauf sauber,
# statt fehlzuschlagen.
#
# Benoetigte Secrets (Settings -> Secrets and variables -> Actions):
#   HOSTINGER_FTP_HOST      z. B. ftp.moosburg.eu
#   HOSTINGER_FTP_USER      FTP-Benutzer aus dem hPanel
#   HOSTINGER_FTP_PASSWORD  zugehoeriges Passwort
#
# Benoetigte Variables (gleiche Seite, Reiter "Variables"):
#   HOSTINGER_REMOTE_DIR    Zielverzeichnis, z. B. /public_html/baumkarte/
#                           (Standard, falls nicht gesetzt)
#   HOSTINGER_BASE_PATH     muss zum Zielverzeichnis passen:
#                           "/baumkarte/" fuer den Unterordner,
#                           "/" fuer eine eigene Subdomain
#
# Achtung: Die Karte liefert rund 52 MB Vector Tiles aus. Der Upload
# uebertraegt nur geaenderte Dateien, der erste Lauf dauert trotzdem.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zugangsdaten pruefen
        id: check
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_HOST }}" ]; then
            echo "Keine Hostinger-Secrets hinterlegt — Lauf wird uebersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Bauen
        if: steps.check.outputs.ready == 'true'
        env:
          BASE_PATH: ${{ vars.HOSTINGER_BASE_PATH || '/baumkarte/' }}
        run: |
          npm ci
          npm run build

      - name: Hochladen
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.HOSTINGER_REMOTE_DIR || '/public_html/baumkarte/' }}
          # Vector Tiles sind gross; der Vergleich laeuft ueber eine
          # Zustandsdatei auf dem Server, damit nur Geaendertes hochgeht.
          state-name: .ftp-deploy-sync-state.json
